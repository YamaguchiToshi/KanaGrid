<!DOCTYPE html>
<!-- KanaGrid — SPDX-License-Identifier: MIT（インライン SVG アイコンは Google Material Symbols: Apache License 2.0） -->
<html lang="ja" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="KanaGrid">
  <meta name="theme-color" content="#EDF2FA">
  <title>KanaGrid</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="app" class="app-shell">
    <!-- 上段：メッセージ表示＆操作バー（全消去・BSをメインキーボードへ移動し、入力領域を最大限拡大） -->
    <header class="top-bar" aria-label="メッセージ表示と操作">
      <!-- メッセージ表示領域（input/textarea不使用でOSキーボードを完全抑制） -->
      <div id="message-display" class="message-display" role="textbox" aria-label="入力中の文章（ダブルタップで拡大）" tabindex="0">
        <div id="message-content" class="message-content"></div>
      </div>

      <!-- カーソル移動＆アクションボタン群（3列×2段・Material Symbols アイコン） -->
      <div class="top-actions">
        <!-- カーソル左 (Material Symbol: chevron_left) -->
        <button type="button" id="btn-cursor-left" class="action-btn action-btn-nav" aria-label="カーソルを1文字左へ">
          <svg class="btn-icon" viewBox="0 -960 960 960" aria-hidden="true">
            <path fill="currentColor" d="m432-480 156 156q15 15 15 36t-15 36q-15 15-36 15t-36-15L324-444q-15-15-15-36t15-36l192-192q15-15 36-15t36 15q15 15 15 36t-15 36L432-480Z"/>
          </svg>
          <span class="btn-label">◀</span>
        </button>

        <!-- カーソル右 (Material Symbol: chevron_right) -->
        <button type="button" id="btn-cursor-right" class="action-btn action-btn-nav" aria-label="カーソルを1文字右へ">
          <svg class="btn-icon" viewBox="0 -960 960 960" aria-hidden="true">
            <path fill="currentColor" d="M528-480 372-636q-15-15-15-36t15-36q15-15 36-15t36 15l192 192q15 15 15 36t-15 36L444-252q-15 15-36 15t-36-15q-15-15-15-36t15-36l156-156Z"/>
          </svg>
          <span class="btn-label">▶</span>
        </button>

        <!-- 全体読み上げ / 停止 (Material Symbol: volume_up / stop) -->
        <button type="button" id="btn-speak-all" class="action-btn action-btn-primary" aria-label="全体読み上げ">
          <svg id="icon-speak" class="btn-icon" viewBox="0 -960 960 960" aria-hidden="true">
            <path fill="currentColor" d="M560-131v-82q90-26 145-100t55-168q0-94-55-168T560-749v-82q124 28 202 125.5T840-481q0 127-78 224.5T560-131ZM120-360v-240h160l200-200v640L280-360H120Zm440 40v-322q47 22 73.5 66t26.5 96q0 51-26.5 94.5T560-320ZM400-606l-86 86H200v80h114l86 86v-252ZM300-480Z"/>
          </svg>
          <svg id="icon-stop" class="btn-icon hidden" viewBox="0 -960 960 960" aria-hidden="true">
            <path fill="currentColor" d="M320-240q-33 0-56.5-23.5T240-320v-320q0-33 23.5-56.5T320-720h320q33 0 56.5 23.5T720-640v320q0 33-23.5 56.5T640-240H320Z"/>
          </svg>
          <span id="label-speak-all" class="btn-label">読み上げ</span>
        </button>

        <!-- 拡大表示 (Material Symbol: open_in_full) -->
        <button type="button" id="btn-expand" class="action-btn" aria-label="拡大表示">
          <svg class="btn-icon" viewBox="0 -960 960 960" aria-hidden="true">
            <path fill="currentColor" d="M120-120v-320h80v184l504-504H520v-80h320v320h-80v-184L256-200h184v80H120Z"/>
          </svg>
          <span class="btn-label">拡大</span>
        </button>

        <!-- コピー (Material Symbol: content_copy) -->
        <button type="button" id="btn-copy" class="action-btn" aria-label="全文コピー">
          <svg class="btn-icon" viewBox="0 -960 960 960" aria-hidden="true">
            <path fill="currentColor" d="M360-240q-33 0-56.5-23.5T280-320v-480q0-33 23.5-56.5T360-880h360q33 0 56.5 23.5T800-800v480q0 33-23.5 56.5T720-240H360Zm0-80h360v-480H360v480ZM200-80q-33 0-56.5-23.5T120-160v-560h80v560h440v80H200Zm160-240v-480 480Z"/>
          </svg>
          <span class="btn-label">コピー</span>
        </button>

        <!-- 設定 (Material Symbol: settings / 誤操作防止のためトリプルタップで開く) -->
        <button type="button" id="btn-settings" class="action-btn" aria-label="設定を開く（3回連続タップ）">
          <svg class="btn-icon" viewBox="0 -960 960 960" aria-hidden="true">
            <path fill="currentColor" d="m370-80-16-128q-13-5-24.5-12T307-235l-119 50L78-375l103-78q-1-7-1-13.5v-27q0-6.5 1-13.5L78-585l110-190 119 50q11-8 23-15t24-12l16-128h220l16 128q13 5 24.5 12t22.5 15l119-50 110 190-103 78q1 7 1 13.5v27q0 6.5-2 13.5l103 78-110 190-118-50q-11 8-23 15t-24 12L590-80H370Zm70-80h79l14-106q31-8 57.5-23.5T639-327l99 41 39-68-86-65q5-14 7-29.5t2-31.5q0-16-2-31.5t-7-29.5l86-65-39-68-99 42q-22-23-48.5-38.5T533-694l-13-106h-79l-14 106q-31 8-57.5 23.5T321-633l-99-41-39 68 86 64q-5 15-7 30t-2 32q0 16 2 31t7 30l-86 65 39 68 99-42q22 23 48.5 38.5T427-266l13 106Zm42-180q58 0 99-41t41-99q0-58-41-99t-99-41q-59 0-99.5 41T342-480q0 58 40.5 99t99.5 41Zm-2-140Z"/>
          </svg>
          <span class="btn-label">設定</span>
        </button>
      </div>
    </header>

    <!-- 中段：ワードプレディクション（予測変換）バー（最大5枠固定） -->
    <section id="prediction-bar" class="prediction-bar" aria-label="予測変換候補">
      <button type="button" class="prediction-slot" data-slot="0"><span class="prediction-text"></span></button>
      <button type="button" class="prediction-slot" data-slot="1"><span class="prediction-text"></span></button>
      <button type="button" class="prediction-slot" data-slot="2"><span class="prediction-text"></span></button>
      <button type="button" class="prediction-slot" data-slot="3"><span class="prediction-text"></span></button>
      <button type="button" class="prediction-slot" data-slot="4"><span class="prediction-text"></span></button>
    </section>

    <!-- 下段：カスタム文字盤グリッド -->
    <main id="board-grid" class="board-grid" aria-label="文字盤"></main>
  </div>

  <!-- 拡大表示（全体プレビュー）モーダル -->
  <div id="modal-expand" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-label="メッセージ拡大表示">
    <div class="modal-expand-container">
      <div id="expand-text" class="expand-text-area"></div>
      <div class="modal-expand-actions">
        <button type="button" id="btn-expand-speak" class="modal-big-btn modal-big-btn-primary">
          <svg class="btn-icon-lg" viewBox="0 -960 960 960" aria-hidden="true">
            <path fill="currentColor" d="M560-131v-82q90-26 145-100t55-168q0-94-55-168T560-749v-82q124 28 202 125.5T840-481q0 127-78 224.5T560-131ZM120-360v-240h160l200-200v640L280-360H120Zm440 40v-322q47 22 73.5 66t26.5 96q0 51-26.5 94.5T560-320Z"/>
          </svg>
          <span id="label-expand-speak">読み上げ</span>
        </button>
        <button type="button" id="btn-expand-copy" class="modal-big-btn">
          <svg class="btn-icon-lg" viewBox="0 -960 960 960" aria-hidden="true">
            <path fill="currentColor" d="M360-240q-33 0-56.5-23.5T280-320v-480q0-33 23.5-56.5T360-880h360q33 0 56.5 23.5T800-800v480q0 33-23.5 56.5T720-240H360Zm0-80h360v-480H360v480ZM200-80q-33 0-56.5-23.5T120-160v-560h80v560h440v80H200Z"/>
          </svg>
          <span>コピー</span>
        </button>
        <button type="button" id="btn-expand-close" class="modal-big-btn">
          <svg class="btn-icon-lg" viewBox="0 -960 960 960" aria-hidden="true">
            <path fill="currentColor" d="m256-200-56-56 224-224-224-224 56-56 224 224 224-224 56 56-224 224 224 224-56 56-224-224-224 224Z"/>
          </svg>
          <span>閉じる</span>
        </button>
      </div>
    </div>
  </div>

  <!-- 消去の確認モーダル（全消去・学習履歴のリセット・ユーザー辞書の削除で共用。文言は app.js の openConfirmDialog で切り替える）。
       設定・ユーザー辞書モーダルの上に重ねて表示する -->
  <div id="modal-confirm-clear" class="modal-overlay modal-confirm hidden" role="dialog" aria-modal="true" aria-labelledby="confirm-clear-title" aria-describedby="confirm-clear-note">
    <div class="modal-dialog">
      <h2 id="confirm-clear-title" class="modal-title">入力した文章をすべて消去しますか？</h2>
      <p id="confirm-clear-note" class="modal-note hidden"></p>
      <p id="confirm-clear-preview" class="modal-preview-text"></p>
      <div class="modal-dialog-buttons">
        <button type="button" id="btn-confirm-clear-no" class="modal-big-btn">キャンセル</button>
        <button type="button" id="btn-confirm-clear-yes" class="modal-big-btn modal-btn-danger">消去する</button>
      </div>
    </div>
  </div>

  <!-- 設定モーダル -->
  <div id="modal-settings" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <div class="modal-dialog modal-settings-dialog">
      <div class="modal-header">
        <h2 id="settings-title" class="modal-title">表示・語彙レベル・音声の設定</h2>
        <button type="button" id="btn-settings-close" class="modal-close-btn" aria-label="設定を閉じる">閉じる ✕</button>
      </div>

      <div class="settings-grid">
        <!-- 1. テーマ切替 -->
        <div class="setting-row">
          <div class="setting-label">カラーテーマ</div>
          <div class="setting-options">
            <button type="button" class="setting-choice" data-setting="theme" data-value="light">
              ライト（明背景・黒文字）
            </button>
            <button type="button" class="setting-choice" data-setting="theme" data-value="dark">
              ダーク（暗背景・白文字）
            </button>
          </div>
        </div>

        <!-- 2. 語彙・漢字レベル（文科省配当学年＋基本語彙配当連動） -->
        <div class="setting-row">
          <div class="setting-label">語彙・漢字レベル（文科省配当学年連動）</div>
          <div class="setting-options setting-options-level">
            <button type="button" class="setting-choice" data-setting="level" data-value="0">かな<br><small>漢字なし</small></button>
            <button type="button" class="setting-choice" data-setting="level" data-value="1">小1<br><small>80字</small></button>
            <button type="button" class="setting-choice" data-setting="level" data-value="2">小2<br><small>240字</small></button>
            <button type="button" class="setting-choice" data-setting="level" data-value="3">小3<br><small>440字</small></button>
            <button type="button" class="setting-choice" data-setting="level" data-value="4">小4<br><small>642字</small></button>
            <button type="button" class="setting-choice" data-setting="level" data-value="5">小5<br><small>835字</small></button>
            <button type="button" class="setting-choice" data-setting="level" data-value="6">小6<br><small>1026字</small></button>
            <button type="button" class="setting-choice" data-setting="level" data-value="7">一般<br><small>常用漢字</small></button>
          </div>
        </div>

        <!-- 3. キー単音読み上げ -->
        <div class="setting-row">
          <div class="setting-label">キー押下時の単音読み上げ</div>
          <div class="setting-options">
            <button type="button" class="setting-choice" data-setting="keySpeech" data-value="on">
              ON（1文字ずつ読み上げる）
            </button>
            <button type="button" class="setting-choice" data-setting="keySpeech" data-value="off">
              OFF（読み上げない）
            </button>
          </div>
        </div>

        <!-- 4. 話速調整 -->
        <div class="setting-row">
          <div class="setting-label">読み上げの速さ（話速）</div>
          <div class="setting-options setting-options-rate">
            <button type="button" class="setting-choice" data-setting="speechRate" data-value="0.6">0.6x<br><small>ゆっくり</small></button>
            <button type="button" class="setting-choice" data-setting="speechRate" data-value="0.8">0.8x<br><small>やや遅め</small></button>
            <button type="button" class="setting-choice" data-setting="speechRate" data-value="1.0">1.0x<br><small>標準</small></button>
            <button type="button" class="setting-choice" data-setting="speechRate" data-value="1.2">1.2x<br><small>やや速め</small></button>
            <button type="button" class="setting-choice" data-setting="speechRate" data-value="1.4">1.4x<br><small>速い</small></button>
          </div>
        </div>

        <!-- 5. ユーザー辞書＆学習履歴管理 -->
        <div class="setting-row">
          <div class="setting-label">ユーザー辞書・学習データ管理</div>
          <div class="setting-options">
            <button type="button" id="btn-open-user-dict" class="setting-action-btn">
              ユーザー辞書を編集（<span id="user-dict-count">0</span>件）
            </button>
            <button type="button" id="btn-reset-learning" class="setting-action-btn setting-action-danger">
              学習履歴をリセット
            </button>
          </div>
        </div>

        <!-- 6. アプリの更新（新しい版が待機しているときだけ表示） -->
        <div id="setting-row-app-update" class="setting-row hidden">
          <div class="setting-label">アプリの更新（新しい版があります。アプリを閉じて開き直しても更新されます）</div>
          <div class="setting-options setting-options-single">
            <button type="button" id="btn-apply-update" class="setting-action-btn setting-action-primary">
              今すぐ更新する（画面を再読み込み・入力中の文章は残ります）
            </button>
          </div>
        </div>
      </div>

      <div class="settings-footer">
        <span id="app-version" class="settings-version">KanaGrid v1.0.2</span>
      </div>
    </div>
  </div>

  <!-- ユーザー辞書編集モーダル -->
  <div id="modal-user-dict" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="user-dict-title">
    <div class="modal-dialog modal-user-dict-dialog">
      <div class="modal-header">
        <h2 id="user-dict-title" class="modal-title">ユーザー辞書の編集（固有名詞・よく使う言葉）</h2>
        <button type="button" id="btn-user-dict-close" class="modal-close-btn" aria-label="ユーザー辞書を閉じる">戻る ✕</button>
      </div>

      <div class="user-dict-form">
        <div class="user-dict-form-row">
          <div class="user-dict-field">
            <label for="user-dict-reading" class="user-dict-label">読み（ひらがな）</label>
            <input type="text" id="user-dict-reading" class="user-dict-input" placeholder="例：たろうさん" autocomplete="off">
          </div>
          <div class="user-dict-field">
            <label for="user-dict-surface" class="user-dict-label">表示する表記（漢字・カタカナ等）</label>
            <input type="text" id="user-dict-surface" class="user-dict-input" placeholder="例：太郎さん" autocomplete="off">
          </div>
          <div class="user-dict-field user-dict-field-cat">
            <label for="user-dict-cat" class="user-dict-label">種類（文脈用）</label>
            <select id="user-dict-cat" class="user-dict-select">
              <option value="person">人名・呼称</option>
              <option value="food">飲食・薬</option>
              <option value="place">場所・施設</option>
              <option value="device">日用品・機器</option>
              <option value="body">身体・症状</option>
              <option value="general">その他名詞</option>
              <option value="intj">定型フレーズ</option>
            </select>
          </div>
        </div>

        <div class="user-dict-form-actions">
          <button type="button" id="btn-import-board-text" class="setting-action-btn">
            文字盤の入力文字を取り込む
          </button>
          <button type="button" id="btn-user-dict-save" class="setting-action-btn setting-action-primary">
            辞書に登録・保存
          </button>
        </div>

        <div class="user-dict-csv-actions">
          <button type="button" id="btn-user-dict-import-csv" class="setting-action-btn">
            CSV読み込み（インポート）
          </button>
          <button type="button" id="btn-user-dict-export-csv" class="setting-action-btn">
            CSV書き出し（エクスポート）
          </button>
          <input type="file" id="user-dict-csv-file" class="hidden" accept=".csv,text/csv,text/plain">
        </div>
      </div>

      <div id="user-dict-list" class="user-dict-list" aria-label="登録済みユーザー辞書一覧"></div>
    </div>
  </div>

  <!-- トースト通知 -->
  <div id="toast" class="toast hidden" role="status" aria-live="polite">コピーしました</div>

  <script src="./dict.js"></script>
  <script src="./app.js"></script>
  <!-- Cloudflare Web Analytics --><script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "ac03e0f4d5644194a5d005a3786f0e9c"}'></script><!-- End Cloudflare Web Analytics -->
</body>
</html>
